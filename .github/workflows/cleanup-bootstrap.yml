name: Remove migration artifacts

on:
  push:
    branches:
      - chore/production-ready-repository

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[migration-cleaned]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Remove generated Python caches and one-time migration files
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -f .github/scripts/expand_project_archive.py
          rm -f .github/workflows/expand-source.yml
          rm -f .github/workflows/cleanup-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes found."
            exit 0
          fi
          git commit -m "chore: remove generated and migration artifacts [migration-cleaned]"
          git push origin "HEAD:${{ github.ref_name }}"
